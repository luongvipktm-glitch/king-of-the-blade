<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>King of the Blade 3D - Heaven Gate Edition</title>
    <style>
        body { margin: 0; overflow: hidden; background: #050508; font-family: 'Segoe UI', sans-serif; user-select: none; }
        #hud { position: absolute; top: 15px; left: 15px; display: flex; flex-direction: column; gap: 8px; z-index: 10; }
        .stat-box { background: rgba(0,0,0,0.8); border: 2px solid #fff; border-radius: 6px; padding: 6px 14px; color: #fff; font-weight: bold; font-size: 14px; box-shadow: 0 4px 8px rgba(0,0,0,0.6); }
        #power-box { border-color: #ff9900; color: #ff9900; }
        #sword-box { border-color: #a335ee; color: #a335ee; }
        #kill-box { border-color: #00ffcc; color: #00ffcc; }
        #boss-hp-bar { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); width: 300px; background: rgba(0,0,0,0.8); border: 2px solid #ff0000; border-radius: 10px; padding: 5px; display: none; text-align: center; color: #fff; z-index: 10; }
        #boss-hp-inner { height: 16px; background: #ff0000; width: 100%; border-radius: 6px; transition: width 0.1s; }
        #instructions { position: absolute; bottom: 15px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.8); color: #fff; padding: 10px 20px; border-radius: 15px; font-size: 13px; text-align: center; border: 1px solid #555; pointer-events: none; }
        #victory-screen { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(255,255,255,0.85); display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 100; }
        #victory-screen h1 { font-size: 60px; color: #d4af37; text-shadow: 0 0 20px #fff, 0 0 30px #ffd700; margin: 0; }
        #crosshair { position: absolute; top: 50%; left: 50%; width: 8px; height: 8px; background: #fff; border-radius: 50%; transform: translate(-50%, -50%); pointer-events: none; z-index: 10; box-shadow: 0 0 6px #fff; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="crosshair"></div>
    <div id="hud">
        <div class="stat-box" id="power-box">⚡ POWER: <span id="val-power">10</span></div>
        <div class="stat-box" id="sword-box">🗡️ KIẾM: <span id="val-sword" style="color:#aaa;">Common (+5 DMG)</span></div>
        <div class="stat-box" id="kill-box">💀 QUÁI ĐÃ HẠ: <span id="val-kills">0</span> / 999</div>
    </div>

    <div id="boss-hp-bar">
        <div id="boss-title" style="font-size:12px; margin-bottom:3px;">BOSS CUỐI (CỤC ĐEN BÍ ẨN)</div>
        <div style="background:#333; border-radius:6px; overflow:hidden;">
            <div id="boss-hp-inner"></div>
        </div>
        <div id="boss-hp-text" style="font-size:11px; margin-top:2px;">15000 / 15000</div>
    </div>

    <div id="instructions">
        <b>[Bấm P]</b> Đổi góc nhìn (FPS / Xem Nhân Vật) | <b>[Click Trái/Phải]</b> Đánh Quái Farm Power & Cấp Kiếm
    </div>

    <div id="victory-screen">
        <h1>OH MY GOD ! you win</h1>
        <p style="font-size: 20px; color: #333; font-weight: bold;">Bạn đã mở được Cổng Thiên Đường!</p>
    </div>

    <script>
        // 1. KỊCH BẢN & BIẾN
        let isFirstPerson = true;
        let power = 10;
        let killCount = 0;
        let swordLevel = 0; // 0: Common, 1: Rare, 2: Epic, 3: Legendary
        const swordNames = ["Common (+5)", "Rare (+15)", "Epic (+45)", "Legendary (+120)"];
        const swordColors = [0xaaaaaa, 0x0088ff, 0xa335ee, 0xffd700];
        const swordDmgs = [5, 15, 45, 120];

        let redHP = 10, blueHP = 1000, bossHP = 15000;
        let isBossSpawned = false;

        // 2. SCENE & CAMERA
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x050508, 0.03);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Ánh sáng
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(5, 10, 7);
        scene.add(dirLight);

        // 3. TẠO MÔ HÌNH NHÂN VẬT 3D (Có vòng thiên thần)
        const playerGroup = new THREE.Group();
        const matSkin = new THREE.MeshStandardMaterial({ color: 0xe0ac69 });
        const matShirt = new THREE.MeshStandardMaterial({ color: 0x111111 });

        // Thân & Đầu
        const body = new THREE.Mesh(new THREE.BoxGeometry(0.8, 1.0, 0.4), matShirt);
        body.position.y = 1.2;
        const head = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.5, 0.5), matSkin);
        head.position.y = 2.0;
        
        // Mắt trắng
        const eyeMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
        const eyeL = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.08, 0.05), eyeMat);
        eyeL.position.set(-0.12, 2.05, 0.26);
        const eyeR = eyeL.clone();
        eyeR.position.x = 0.12;

        // Vòng thiên thần (Halo)
        const haloGeo = new THREE.TorusGeometry(0.3, 0.04, 8, 24);
        const haloMat = new THREE.MeshBasicMaterial({ color: 0x111111 });
        const halo = new THREE.Mesh(haloGeo, haloMat);
        halo.rotation.x = Math.PI / 2;
        halo.position.set(0, 2.5, 0);

        // Tay Chân
        const armL = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.8, 0.3), matSkin); armL.position.set(-0.6, 1.2, 0);
        const armR = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.8, 0.3), matSkin); armR.position.set(0.6, 1.2, 0);
        const legL = new THREE.Mesh(new THREE.BoxGeometry(0.35, 0.8, 0.35), matSkin); legL.position.set(-0.22, 0.4, 0);
        const legR = new THREE.Mesh(new THREE.BoxGeometry(0.35, 0.8, 0.35), matSkin); legR.position.set(0.22, 0.4, 0);

        playerGroup.add(body, head, eyeL, eyeR, halo, armL, armR, legL, legR);
        playerGroup.position.set(0, 0, 3);
        scene.add(playerGroup);

        // 4. BẢN ĐỒ & CỔNG THIÊN ĐƯỜNG
        const floor = new THREE.Mesh(new THREE.PlaneGeometry(25, 25), new THREE.MeshStandardMaterial({ color: 0x1a1a24 }));
        floor.rotation.x = -Math.PI / 2;
        scene.add(floor);

        // Cổng Thiên Đường (Phía sau)
        const gateGroup = new THREE.Group();
        const stoneMat = new THREE.MeshStandardMaterial({ color: 0x555566, roughness: 0.8 });
        const pillarL = new THREE.Mesh(new THREE.BoxGeometry(0.8, 5, 0.8), stoneMat); pillarL.position.set(-2, 2.5, -6);
        const pillarR = new THREE.Mesh(new THREE.BoxGeometry(0.8, 5, 0.8), stoneMat); pillarR.position.set(2, 2.5, -6);
        const topBar = new THREE.Mesh(new THREE.BoxGeometry(5, 0.8, 0.8), stoneMat); topBar.position.set(0, 5, -6);
        
        // Màn sáng cổng
        const gateLightGeo = new THREE.PlaneGeometry(3.2, 4.5);
        const gateLightMat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0 });
        const gateLight = new THREE.Mesh(gateLightGeo, gateLightMat);
        gateLight.position.set(0, 2.3, -5.9);

        gateGroup.add(pillarL, pillarR, topBar, gateLight);
        scene.add(gateGroup);

        // 5. MÔ HÌNH QUÁI VẬT (GOLEM)
        function createMonster(color) {
            const group = new THREE.Group();
            const mat = new THREE.MeshStandardMaterial({ color: color, roughness: 0.4 });
            const mBody = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 0.8), mat); mBody.position.y = 0.9;
            const mHead = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.5, 0.5), mat); mHead.position.y = 1.6;
            group.add(mBody, mHead);
            return group;
        }

        const redMonster = createMonster(0xff3333); redMonster.position.set(-3, 0, -1); scene.add(redMonster);
        const blueMonster = createMonster(0x3388ff); blueMonster.position.set(3, 0, -1); scene.add(blueMonster);

        // Boss Cục Đen Bí Ẩn
        const bossGeo = new THREE.BoxGeometry(2, 2, 2);
        const bossMat = new THREE.MeshStandardMaterial({ color: 0x050505, roughness: 0.1, metalness: 0.9 });
        const bossMonster = new THREE.Mesh(bossGeo, bossMat);
        bossMonster.position.set(0, 1.5, -2);
        bossMonster.visible = false;
        scene.add(bossMonster);

        // 6. CAMERA UPDATER
        function updateCamera() {
            if (isFirstPerson) {
                camera.position.set(playerGroup.position.x, 1.8, playerGroup.position.z);
                camera.lookAt(0, 1.5, -5);
                playerGroup.visible = false;
                document.getElementById('crosshair').style.display = 'block';
            } else {
                camera.position.set(0, 4, 8);
                camera.lookAt(0, 1, 0);
                playerGroup.visible = true;
                document.getElementById('crosshair').style.display = 'none';
            }
        }
        updateCamera();

        // Đổi góc nhìn bằng phím P
        window.addEventListener('keydown', (e) => {
            if (e.key === 'p' || e.key === 'P') {
                isFirstPerson = !isFirstPerson;
                updateCamera();
            }
        });

        // 7. SỰ KIỆN TƯƠNG TÁC & CHIẾN ĐẤU
        window.addEventListener('click', (e) => {
            const totalDmg = Math.floor(power / 2) + swordDmgs[swordLevel];
            const isLeftClick = e.clientX < window.innerWidth / 2;

            if (isBossSpawned) {
                // Đánh Boss Cục Đen
                bossHP -= totalDmg;
                if (bossHP < 0) bossHP = 0;
                document.getElementById('boss-hp-inner').style.width = `${(bossHP / 15000) * 100}%`;
                document.getElementById('boss-hp-text').innerText = `${bossHP} / 15000`;

                if (bossHP <= 0) {
                    bossMonster.visible = false;
                    triggerVictory();
                }
            } else {
                if (isLeftClick) {
                    // Đánh Quái Đỏ
                    redHP -= 1;
                    if (redHP <= 0) {
                        redHP = 10;
                        power += 5;
                        killCount++;
                        checkUpgradeSword();
                    }
                } else {
                    // Đánh Quái Xanh
                    blueHP -= totalDmg;
                    if (blueHP <= 0) {
                        blueHP = 1000;
                        power += 25;
                        killCount += 5;
                        checkUpgradeSword();
                    }
                }

                // Kiểm tra triệu hồi Boss khi đủ 999 mạng
                if (killCount >= 999) {
                    spawnBoss();
                }
            }

            updateHUD();
        });

        function checkUpgradeSword() {
            if (killCount >= 100 && swordLevel < 1) swordLevel = 1; // Rare
            if (killCount >= 300 && swordLevel < 2) swordLevel = 2; // Epic
            if (killCount >= 600 && swordLevel < 3) swordLevel = 3; // Legendary
        }

        function spawnBoss() {
            isBossSpawned = true;
            redMonster.visible = false;
            blueMonster.visible = false;
            bossMonster.visible = true;
            document.getElementById('boss-hp-bar').style.display = 'block';
        }

        function triggerVictory() {
            gateLightMat.opacity = 0.9;
            document.getElementById('boss-hp-bar').style.display = 'none';
            setTimeout(() => {
                document.getElementById('victory-screen').style.display = 'flex';
            }, 1000);
        }

        function updateHUD() {
            document.getElementById('val-power').innerText = power;
            document.getElementById('val-kills').innerText = killCount;
            const swordBox = document.getElementById('val-sword');
            swordBox.innerText = swordNames[swordLevel];
            swordBox.style.color = `#${swordColors[swordLevel].toString(16)}`;
        }

        // Loop
        function animate() {
            requestAnimationFrame(animate);
            if (bossMonster.visible) bossMonster.rotation.y += 0.02;
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
