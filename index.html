<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mystic Temple 3D - Multi-Language & Upgrade System (@viluong673)</title>
    <style>
        * { box-sizing: border-box; }
        body { 
            margin: 0; 
            overflow: hidden; 
            background: #05020a; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        #game-container {
            position: relative;
            width: 1000px;
            height: 650px;
            background: #121019;
            border: 3px solid #a335ee;
            box-shadow: 0 0 25px rgba(163, 53, 238, 0.4);
        }
        canvas { display: block; background: #0c0914; }
        
        #hud { 
            position: absolute; 
            top: 15px; 
            left: 15px; 
            display: flex; 
            gap: 10px;
            z-index: 10;
            pointer-events: none;
        }
        .stat-box { 
            background: rgba(10, 5, 20, 0.85); 
            border: 2px solid #a335ee; 
            padding: 8px 12px; 
            border-radius: 6px;
            font-size: 14px;
            font-weight: bold;
        }
        #power-box { border-color: #ff9900; color: #ff9900; }
        #sword-box { border-color: #a335ee; color: #a335ee; }
        #kill-box { border-color: #00ffcc; color: #00ffcc; }
        #gold-box { border-color: #ffd700; color: #ffd700; }

        .overlay-ui {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 20;
        }
        .hidden { display: none !important; }
        
        .modal-panel {
            background: #1a1325;
            border: 3px solid #a335ee;
            padding: 25px;
            border-radius: 12px;
            text-align: center;
            width: 550px;
            box-shadow: 0 0 20px rgba(163, 53, 238, 0.5);
        }
        button {
            padding: 8px 16px;
            background: #a335ee;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 14px;
            cursor: pointer;
            font-weight: bold;
            margin: 4px;
            transition: 0.2s;
        }
        button:hover { background: #b95eff; }
        .btn-red { background: #dc3232; }
        .btn-red:hover { background: #ff4d4d; }
        .btn-green { background: #28a745; }
        .btn-green:hover { background: #34ce57; }
    </style>
</head>
<body>

<div id="game-container">
    <!-- HUD TRÊN GÓC TRÁI -->
    <div id="hud">
        <div class="stat-box" id="gold-box">Gold: 1000 G</div>
        <div class="stat-box" id="kill-box">Kills: 0 / 999</div>
        <div class="stat-box" id="sword-box">Power: 100</div>
        <div class="stat-box" id="power-box">Lang: VI ([V])</div>
    </div>

    <!-- CANVAS GAME -->
    <canvas id="gameCanvas" width="1000" height="650"></canvas>

    <!-- BẢNG TÚI ĐỒ (INVENTORY) -->
    <div id="inventory-screen" class="overlay-ui hidden">
        <div class="modal-panel">
            <h2 id="inv-title" style="color: #ffd700; margin-top: 0;">TÚI ĐỒ TRANG BỊ</h2>
            <div id="inv-items-list" style="max-height: 280px; overflow-y: auto; text-align: left; margin: 15px 0;"></div>
            <button onclick="closeInventory()" class="btn-red" id="inv-close-btn">ĐÓNG (I)</button>
        </div>
    </div>

    <!-- BẢNG NÂNG CẤP NPC -->
    <div id="upgrade-screen" class="overlay-ui hidden">
        <div class="modal-panel">
            <h2 id="up-title" style="color: #ffd700; margin-top: 0;">KHU VỰC NÂNG CẤP THẦN KỲ</h2>
            <div style="margin: 10px 0;">
                <button onclick="selectUpgradeType('Common')">Common</button>
                <button onclick="selectUpgradeType('Rare')">Rare</button>
                <button onclick="selectUpgradeType('Epic')">Epic</button>
                <button onclick="selectUpgradeType('Legendary')">Legendary</button>
            </div>
            <p id="up-selected-info" style="font-size: 16px; font-weight: bold; margin: 12px 0;">Đang chọn: Common</p>
            <p id="up-rate-info" style="color: #00ffcc; font-size: 14px;"></p>
            <p id="up-result-msg" style="height: 22px; font-weight: bold; margin: 10px 0;"></p>
            <div style="margin-top: 15px;">
                <button onclick="executeUpgrade()" class="btn-green" id="up-exec-btn">NÂNG CẤP (+25% Sức Mạnh)</button>
                <button onclick="closeUpgrade()" class="btn-red" id="up-back-btn">QUAY LẠI</button>
            </div>
        </div>
    </div>
</div>

<script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    let currentLang = "VI"; // VI hoặc EN
    const textDict = {
        VI: {
            invTitle: "TÚI ĐỒ TRANG BỊ (Nhấn I để mở/đóng)",
            close: "ĐÓNG",
            upTitle: "KHU VỰC NÂNG CẤP TRANG BỊ",
            upgradeBtn: "NÂNG CẤP",
            backBtn: "QUAY LẠI",
            sell10: "Bán 10",
            equip: "Đeo/Tháo",
            equippedTxt: "[ĐÃ ĐEO]",
            maxLvl: "Đã đạt cấp tối đa để đeo!"
        },
        EN: {
            invTitle: "EQUIPMENT INVENTORY (Press I)",
            close: "CLOSE",
            upTitle: "EQUIPMENT UPGRADE STATION",
            upgradeBtn: "UPGRADE",
            backBtn: "BACK",
            sell10: "Sell 10",
            equip: "Equip",
            equippedTxt: "[EQUIPPED]",
            maxLvl: "Max level reached for equipment!"
        }
    };

    let player = { x: 300, y: 350, speed: 4 };
    let npc = { x: 800, y: 350 };
    let monsters = [
        { x: 200, y: 200, alive: true },
        { x: 500, y: 150, alive: true },
        { x: 700, y: 500, alive: true },
        { x: 350, y: 500, alive: true }
    ];

    let playerData = {
        gold: 1500,
        kills: 0,
        inventory: {
            Common: { count: 45, level: 1, equipped: false },
            Rare: { count: 12, level: 1, equipped: false },
            Epic: { count: 3, level: 1, equipped: false },
            Legendary: { count: 1, level: 1, equipped: false }
        }
    };

    let gameState = "PLAYING"; // PLAYING, INVENTORY, UPGRADE
    let selectedUpgradeItem = "Common";
    let keys = {};

    window.addEventListener("keydown", (e) => {
        keys[e.key.toLowerCase()] = true;
        if (e.key.toLowerCase() === 'v') {
            currentLang = currentLang === "VI" ? "EN" : "VI";
        }
        if (e.key.toLowerCase() === 'i') {
            if (gameState === "PLAYING") {
                gameState = "INVENTORY";
                openInventoryModal();
            } else if (gameState === "INVENTORY") {
                closeInventory();
            }
        }
        if (e.key === ' ' && gameState === "PLAYING") {
            attackMonster();
        }
    });
    window.addEventListener("keyup", (e) => { keys[e.key.toLowerCase()] = false; });

    function attackMonster() {
        monsters.forEach(m => {
            if (m.alive && Math.hypot(player.x - m.x, player.y - m.y) < 55) {
                m.alive = false;
                playerData.kills++;

                // Sau mỗi 999 kill thả item theo yêu cầu
                if (playerData.kills % 999 === 0) {
                    let commonDrop = Math.floor(Math.random() * 11) + 50; // 50-60 common
                    let rareDrop = 20; // 20 rare
                    playerData.inventory.Common.count += commonDrop;
                    playerData.inventory.Rare.count += rareDrop;
                }

                setTimeout(() => {
                    m.x = Math.random() * 700 + 100;
                    m.y = Math.random() * 450 + 100;
                    m.alive = true;
                }, 1500);
            }
        });
    }

    function openInventoryModal() {
        let t = textDict[currentLang];
        let html = "";
        for (let type in playerData.inventory) {
            let item = playerData.inventory[type];
            let eqText = item.equipped ? `<span style="color:#00ffcc">${t.equippedTxt}</span>` : "";
            html += `<div style="display:flex; justify-content:space-between; align-items:center; background:#120d1c; padding:10px; margin:6px 0; border-radius:6px; border:1px solid #443366;">
                <span><b>${type}</b>: ${item.count} cái | Lv.${item.level} ${eqText}</span>
                <div>
                    <button onclick="sellItems('${type}')" class="btn-red" style="padding:5px 10px; font-size:12px;">${t.sell10}</button>
                    <button onclick="toggleEquip('${type}')" class="btn-green" style="padding:5px 10px; font-size:12px;">${t.equip}</button>
                </div>
            </div>`;
        }
        document.getElementById("inv-items-list").innerHTML = html;
        document.getElementById("inv-title").innerText = t.invTitle;
        document.getElementById("inv-close-btn").innerText = t.close;
        document.getElementById("inventory-screen").classList.remove("hidden");
    }

    function closeInventory() {
        gameState = "PLAYING";
        document.getElementById("inventory-screen").classList.add("hidden");
    }

    function sellItems(type) {
        if (playerData.inventory[type].count >= 10) {
            playerData.inventory[type].count -= 10;
            if (type === "Common") playerData.gold += 490; // 10 common = 490 gold
            if (type === "Rare") playerData.gold += 555;   // 10 rare = 555 gold
            if (type === "Epic") playerData.gold += 800;
            if (type === "Legendary") playerData.gold += 2000;
            openInventoryModal();
        }
    }

    function toggleEquip(type) {
        playerData.inventory[type].equipped = !playerData.inventory[type].equipped;
        openInventoryModal();
    }

    function selectUpgradeType(type) {
        selectedUpgradeItem = type;
        document.getElementById("up-selected-info").innerText = (currentLang === "VI" ? "Đang chọn: " : "Selected: ") + type;
        updateUpgradeRateText();
    }

    function updateUpgradeRateText() {
        let item = playerData.inventory[selectedUpgradeItem];
        let rate = 0;
        // Công thức tỷ lệ theo yêu cầu
        if (selectedUpgradeItem === "Common") rate = Math.max(5, 60 - (item.level - 1) * 5);
        else if (selectedUpgradeItem === "Rare") rate = Math.max(5, 45 - (item.level - 1) * 4);
        else if (selectedUpgradeItem === "Epic") rate = Math.max(2, 30 - (item.level - 1) * 2.5);
        else if (selectedUpgradeItem === "Legendary") rate = 0.1;

        let txt = currentLang === "VI" 
            ? `Cấp hiện tại: Lv.${item.level} | Tỷ lệ thành công: ${rate}% (+25% Sức mạnh)`
            : `Current Level: Lv.${item.level} | Success Rate: ${rate}% (+25% Power)`;
        document.getElementById("up-rate-info").innerText = txt;
    }

    function executeUpgrade() {
        let item = playerData.inventory[selectedUpgradeItem];
        let rate = 0;
        if (selectedUpgradeItem === "Common") rate = Math.max(0.05, 0.60 - (item.level - 1) * 0.05);
        else if (selectedUpgradeItem === "Rare") rate = Math.max(0.05, 0.45 - (item.level - 1) * 0.04);
        else if (selectedUpgradeItem === "Epic") rate = Math.max(0.02, 0.30 - (item.level - 1) * 0.025);
        else if (selectedUpgradeItem === "Legendary") rate = 0.001;

        if (selectedUpgradeItem === "Legendary" && item.level >= 2) {
            document.getElementById("up-result-msg").innerText = textDict[currentLang].maxLvl;
            document.getElementById("up-result-msg").style.color = "#ff4d4d";
            return;
        }

        if (Math.random() < rate) {
            item.level++;
            document.getElementById("up-result-msg").innerText = currentLang === "VI" ? "Nâng cấp thành công! (+25% Sức mạnh)" : "Upgrade Successful! (+25% Power)";
            document.getElementById("up-result-msg").style.color = "#28a745";
        } else {
            document.getElementById("up-result-msg").innerText = currentLang === "VI" ? "Nâng cấp thất bại!" : "Upgrade Failed!";
            document.getElementById("up-result-msg").style.color = "#ff4d4d";
        }
        updateUpgradeRateText();
    }

    function closeUpgrade() {
        gameState = "PLAYING";
        document.getElementById("upgrade-screen").classList.add("hidden");
    }

    function calculateTotalPower() {
        let basePower = 100;
        for (let type in playerData.inventory) {
            let item = playerData.inventory[type];
            if (item.equipped) {
                // +25% sức mạnh mỗi cấp
                let multiplier = Math.pow(1.25, item.level - 1);
                basePower += 50 * multiplier * item.level;
            }
        }
        return Math.floor(basePower);
    }

    function gameLoop() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        if (gameState === "PLAYING") {
            if (keys['w'] || keys['arrowup']) player.y -= player.speed;
            if (keys['s'] || keys['arrowdown']) player.y += player.speed;
            if (keys['a'] || keys['arrowleft']) player.x -= player.speed;
            if (keys['d'] || keys['arrowright']) player.x += player.speed;

            player.x = Math.max(30, Math.min(canvas.width - 30, player.x));
            player.y = Math.max(60, Math.min(canvas.height - 30, player.y));

            // Va chạm với NPC để mở bảng nâng cấp
            if (Math.hypot(player.x - npc.x, player.y - npc.y) < 60) {
                gameState = "UPGRADE";
                document.getElementById("upgrade-screen").classList.remove("hidden");
                selectUpgradeType("Common");
            }
        }

        // Vẽ quái
        monsters.forEach(m => {
            if (m.alive) {
                ctx.fillStyle = "#ff3366";
                ctx.beginPath(); ctx.arc(m.x, m.y, 14, 0, Math.PI * 2); ctx.fill();
                ctx.strokeStyle = "#fff"; ctx.lineWidth = 2; ctx.stroke();
            }
        });

        // Vẽ NPC áo đỏ nâng cấp
        ctx.fillStyle = "#a31a1a";
        ctx.fillRect(npc.x - 16, npc.y - 22, 32, 48);
        ctx.fillStyle = "#ffd700";
        ctx.beginPath(); ctx.arc(npc.x, npc.y - 32, 12, 0, Math.PI * 2); ctx.fill();

        // Vẽ Nhân vật chính (Áo đỏ ngầu)
        ctx.fillStyle = "#dc3232";
        ctx.fillRect(player.x - 16, player.y - 22, 32, 48);
        ctx.fillStyle = "#111";
        ctx.beginPath(); ctx.arc(player.x, player.y - 32, 12, 0, Math.PI * 2); ctx.fill();

        // Cập nhật thông số HUD
        document.getElementById("gold-box").innerText = `Gold: ${playerData.gold} G`;
        document.getElementById("kill-box").innerText = `Kills: ${playerData.kills} / 999`;
        document.getElementById("sword-box").innerText = `Power: ${calculateTotalPower()}`;
        document.getElementById("power-box").innerText = `Lang: ${currentLang} ([V])`;

        requestAnimationFrame(gameLoop);
    }

    requestAnimationFrame(gameLoop);
</script>

</body>
</html>
